spring:
  application:
    name: hauptbuch
  # Dev datasource points at the local docker-compose Postgres (see docker-compose.yml).
  # The Pi deployment overrides these via environment in a later stage.
  datasource:
    url: jdbc:postgresql://localhost:15432/hauptbuch
    username: hauptbuch
    password: hauptbuch
  # Flyway applies migrations on start. No migrations exist yet (stage 3 adds them);
  # an empty migration set is a valid, no-op state.
  flyway:
    enabled: true
  # Receipt uploads (stage 9b). The hard cap is re-checked in ReceiptStorage so the rejection
  # message is ours; the multipart limit sits just above it as a coarse guard.
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 20MB
  # Static assets are content-hashed (/js/keyboard.js -> /js/keyboard-<md5>.js) and served with a
  # one-year immutable cache. Every template already links them through Thymeleaf `@{...}`, which
  # Spring's ResourceUrlEncodingFilter rewrites to the hashed URL, so a deploy that changes a file
  # changes its URL and the browser cannot reuse the old copy.
  #
  # Without this Spring Boot sends NO Cache-Control at all, leaving browsers to guess a freshness
  # lifetime from Last-Modified. On the Pi that guess kept Safari running a pre-fix receipt-editor.js
  # after the deploy — the receipt was cropped and downscaled by the new pipeline but saved in colour,
  # because the old copy's grayscale/contrast bake was the `ctx.filter` no-op (issue 12 regression).
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true

# Receipt image storage (ARCH-07, stage 9b). Dev default: a throwaway local directory (git-ignored).
# The Pi deployment overrides hauptbuch.receipts.storage-root via environment to its data dir; tests
# point it at a temp directory.
hauptbuch:
  # Database backups (.scratch/backup/issues/01-database-backups.md). `automatic` is OFF here on
  # purpose: this file is on the classpath in dev AND in the test suites, and neither has any
  # business shelling out to pg_dump on every context start. The Pi's /etc/hauptbuch/application.yml
  # turns it on — see deploy/application.yml.example.
  backup:
    storage-root: ./.local-backups
    keep-automatic: 30
    automatic: false
    daily-cron: "0 0 3 * * *"
  receipts:
    storage-root: ./.local-receipts
    # Receipt-parse max_tokens (stage 9e/9h). On Sonnet-family models this budget is shared with
    # adaptive thinking, so it must have real headroom over the visible TOON output — a 4096 cap
    # truncated ordinary-sized receipts (issue 02). 16384 comfortably covers a ~50-item receipt.
    ai:
      max-tokens: 16384
