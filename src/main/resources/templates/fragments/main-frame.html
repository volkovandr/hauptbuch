<!DOCTYPE html>
<!--
  The main page's Frame content (reporting.md §11, plan stage d2): renders the shared
  fragments/frame.html fragment only when a Report is configured — "With no Report chosen the
  Frame is hidden and only the picker remains." landing.html itself owns the stable
  id="main-frame" swap target (present from first paint, so fragments/main-frame-picker.html's
  retargeted POST can never race this fragment's own slower initial hx-get); this fragment only
  ever supplies that target's contents (innerHTML), never the target element itself.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="frame">
      <div th:if="${frame.configured()}">
        <div th:replace="~{fragments/frame :: frame(frame=${frame})}"></div>
      </div>
    </th:block>
  </body>
</html>
