<!DOCTYPE html>
<!--
  A Report's rendered table body (reporting.md §10): the {@code report} model attribute
  (ReportTableViewAssembler) drawn as a grid, with its row/column totals when shown. Shared by
  report-table.html (a Preset's own page) and fragments/frame.html (any Frame, plan stage d2) so the
  two cannot drift on whether totals appear.

  Every cell is a ReportTableView.CellText: `text` is already display-formatted, `help` is non-null
  only for an illegal "—" (§7.2) and renders the help marker (§11a.7) naming which reason applies.

  A row's expand/collapse control (reporting.md §9.1/§9.2, plan stage e2, issue 02) requests
  `row.toggleUrl()` (RowToggle) and swaps the page region exactly like a settings change
  (report-settings.html): #report-frame, plus every settings group and the actions strip out of band,
  so their hidden fields carry the new expansion too. On a saved Report with no unsaved edits it
  POSTs, and the Report remembers the new state; on any other editor page it re-GETs the page with
  the toggled expansion and replaces the URL, keeping it only for as long as the draft lives. A
  Frame's compact card has no toggle URL: it draws the triangle with a help marker instead.

  Columns cannot be expanded by hand (§9.1), but `auto` can still expand a filtered node on the
  column axis. An expanded parent column (a subtotal over the columns after it) renders bold, and a
  nested column muted with a ↳ marker (reports.css), so the header shows the hierarchy.

  The included fragment is `report`, not `table`: a fragment selector is also a markup selector, so
  `:: table` would match the `grid` <table> element too and draw it twice.

  Drill-down (reporting.md §12): with `report.drillParams()` set, the table sits in one plain GET
  form to /reports/cell carrying the Report's spec once as hidden fields, and every figure that has
  a posting set is a submit button naming its own `cell` — no per-cell URL repeating the spec.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="report">
      <form
        th:if="${report.drillParams() != null}"
        class="report__drill-form"
        method="get"
        th:action="@{/reports/cell}"
      >
        <th:block
          th:replace="~{fragments/report-actions :: hidden-fields(${report.drillParams()})}"
        ></th:block>
        <table th:replace="~{:: grid}"></table>
      </form>
      <th:block th:if="${report.drillParams() == null}">
        <table th:replace="~{:: grid}"></table>
      </th:block>
    </th:block>

    <table class="report" th:fragment="grid">
      <thead>
        <tr>
          <th></th>
          <!--/* \_\_ is Thymeleaf's escape for a literal "__": two unescaped BEM names in one
                 attribute would read as a __...__ preprocessing expression. */-->
          <th
            th:each="col : ${report.columns()}"
            th:text="${col.label()}"
            th:classappend="${col.parent() ? 'report\_\_col--parent' : (col.depth() > 0 ? 'report\_\_col--child' : null)}"
          >Column</th>
          <th th:if="${report.showRowTotals()}">Total</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="row : ${report.rows()}">
          <td th:style="|padding-left: ${row.depth() * 20}px|">
            <!--/* A null th:attr value drops the attribute: exactly one of hx-post/hx-get renders. */-->
            <button
              th:if="${row.toggleUrl() != null}"
              type="button"
              class="report__toggle"
              th:text="${row.expanded()} ? '▾' : '▸'"
              hx-target="#report-frame"
              hx-select="#report-frame"
              hx-swap="outerHTML"
              th:attr="hx-post=${report.togglePersists()} ? ${row.toggleUrl()} : null,
                       hx-get=${report.togglePersists()} ? null : ${row.toggleUrl()},
                       hx-replace-url=${report.togglePersists()} ? null : 'true',
                       hx-select-oob=${settings.refreshedRegions()}"
            >▸</button>
            <th:block th:if="${row.expandable() and row.toggleUrl() == null}">
              <span
                class="report__toggle report__toggle--static"
                th:text="${row.expanded()} ? '▾' : '▸'"
              >▸</span>
              <span
                th:replace="~{fragments/help-marker :: marker('Open this report to expand or collapse rows.')}"
              ></span>
            </th:block>
            <span th:text="${row.label()}">Row</span>
          </td>
          <td
            class="num"
            th:each="cell, cellStat : ${row.cells()}"
            th:classappend="${report.columns()[cellStat.index].parent()} ? 'report__col--parent'"
          >
            <span th:replace="~{:: figure(${cell})}">0,00</span>
            <span th:if="${cell.help() != null}">
              <span th:replace="~{fragments/help-marker :: marker(${cell.help()})}"></span>
            </span>
          </td>
          <td class="num" th:if="${report.showRowTotals()}">
            <span th:replace="~{:: figure(${row.rowTotal()})}">0,00</span>
            <span th:if="${row.rowTotal().help() != null}">
              <span
                th:replace="~{fragments/help-marker :: marker(${row.rowTotal().help()})}"
              ></span>
            </span>
          </td>
        </tr>
      </tbody>
      <tfoot th:if="${report.showColumnTotals()}">
        <tr>
          <td>Total</td>
          <td class="num" th:each="total : ${report.columnTotals()}">
            <span th:replace="~{:: figure(${total})}">0,00</span>
            <span th:if="${total.help() != null}">
              <span th:replace="~{fragments/help-marker :: marker(${total.help()})}"></span>
            </span>
          </td>
          <td class="num" th:if="${report.showRowTotals()}">
            <span th:replace="~{:: figure(${report.grandTotal()})}">0,00</span>
            <span th:if="${report.grandTotal().help() != null}">
              <span
                th:replace="~{fragments/help-marker :: marker(${report.grandTotal().help()})}"
              ></span>
            </span>
          </td>
        </tr>
      </tfoot>
    </table>

    <!-- One figure's text: a submit button opening its drill-down when it has one, else plain. -->
    <th:block th:fragment="figure(figure)">
      <button
        th:if="${figure.drill() != null}"
        type="submit"
        class="report__drill"
        name="cell"
        th:value="${figure.drill()}"
        th:text="${figure.text()}"
      >0,00</button>
      <span th:if="${figure.drill() == null}" th:text="${figure.text()}">0,00</span>
    </th:block>
  </body>
</html>
