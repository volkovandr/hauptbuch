<!DOCTYPE html>
<!--
  The dock on the statement page (statements.md §6.4, plan slices d1–d2): a missing line's
  transaction booked and matched in one go, a proposed transaction amended to the bank's figures and
  matched, or an extra edited (nothing matched). It is a full-width row directly under the line or
  extra it belongs to, so the operator never scrolls to find it. Category and tags resolve through the shared
  /categories/resolve and /categories/tags/resolve exactly as the register's dock does.

  The form swaps the whole <main> (hx-select), and that setting is inherited by every htmx element
  inside it — which would filter the small fragments the pickers return down to nothing and wipe
  the resolved category. So the fields wrapper resets hx-select to `unset`; only Save, outside the
  wrapper, swaps the page.
-->
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!--
      The dock as a full-width table row, and the row that says why it cannot open. Both are used by
      the full page and by the dock-only endpoints. `.statement-dock-row` is what Cancel deletes and
      what opening another dock replaces.
    -->
    <th:block th:fragment="dockRow(statementId, dock, lists, columns)">
      <tr class="statement-dock-row">
        <td th:colspan="${columns}">
          <th:block th:replace="~{:: dock(${statementId}, ${dock}, ${lists})}"></th:block>
        </td>
      </tr>
    </th:block>

    <th:block th:fragment="refusalRow(columns, refusal, transactionId)">
      <tr>
        <td th:colspan="${columns}" class="statements__error" role="alert">
          <span th:text="${refusal}">Only a simple two-leg transaction can be edited here.</span>
          <a th:if="${transactionId != null}" th:href="@{/register(selected=${transactionId})}"
            >Change it in the register</a
          >
        </td>
      </tr>
    </th:block>

    <!--
      What the dock-only endpoints return: the dock (or the refusal) for the clicked row, and an
      out-of-band delete of any dock already open, so there is only ever one.
    -->
    <th:block th:fragment="openedDock(statementId, columns)">
      <tr hidden hx-swap-oob="delete:.statement-dock-row"></tr>
      <th:block th:if="${dock != null}">
        <th:block th:replace="~{:: dockRow(${statementId}, ${dock}, ${lists}, ${columns})}"></th:block>
      </th:block>
      <th:block th:if="${refusal != null}">
        <th:block th:replace="~{:: refusalRow(${columns}, ${refusal}, ${refusalTransactionId})}"></th:block>
      </th:block>
    </th:block>

    <th:block th:fragment="dock(statementId, dock, lists)">
      <div id="statement-dock" class="statement-dock">
        <p class="eyebrow" th:text="${dock.title()}">Create transaction</p>
        <p class="muted" th:if="${!dock.bankText().isEmpty()}">
          <span th:text="${dock.bankText()}">SHOPAAA SAGT DANKE</span>
          <span th:if="${!dock.bankCategory().isEmpty()}">
            · Bank category: <span th:text="${dock.bankCategory()}">Groceries</span>
          </span>
        </p>
        <p class="muted" th:if="${!dock.notice().isEmpty()}" th:text="${dock.notice()}">
          Booked as 3,00; saving sets it to the bank's 3,50.
        </p>
        <form
          class="entry-dock"
          method="post"
          th:action="@{${dock.path(statementId)}}"
          th:attr="hx-post=@{${dock.path(statementId)}}"
          hx-target="main"
          hx-select="main"
          hx-swap="outerHTML"
        >
          <div class="entry-dock__fields" hx-select="unset">
            <div class="field">
              <label class="field__label" for="dock-date">Date</label>
              <input id="dock-date" name="date" type="date" class="input" th:value="${dock.input().date()}" required />
            </div>
            <div class="field">
              <label class="field__label" for="dock-amount">Amount</label>
              <input
                id="dock-amount"
                class="input input--amount"
                th:value="${dock.amount()}"
                th:name="${dock.amountEditable()} ? 'amount'"
                th:readonly="${!dock.amountEditable()}"
              />
            </div>
            <!-- The counterpart's amounts, when the booking is cross-currency. A transfer picked on a
                 new line asks the server for them (rate-proposed) each time the category resolves. -->
            <div
              id="dock-cross"
              class="entry-dock__cross"
              th:attr="hx-get=${dock.suggestsCrossCurrency()} ? @{/statements/{id}/lines/{line}/cross-currency(id=${statementId},line=${dock.lineId()})}"
              hx-trigger="htmx:afterSwap from:#entry-category-resolved, dock-category-filled from:body"
              hx-include="#dock-date, #entry-category-resolved"
              hx-target="this"
              hx-select="unset"
              hx-swap="innerHTML"
            >
              <th:block th:if="${dock.crossCurrency()}">
                <th:block
                  th:replace="~{:: crossFields(${dock.input().categoryCurrencyCode()}, ${dock.input().categoryAmount()}, ${dock.input().baseAmount() != null}, ${dock.input().baseAmount()})}"
                ></th:block>
              </th:block>
            </div>
            <div class="field">
              <label class="field__label" for="dock-payee">Payee</label>
              <input
                id="dock-payee"
                name="payeeText"
                class="input"
                list="dock-payee-options"
                autocomplete="off"
                th:value="${dock.input().payeeText()}"
                hx-get="/statements/dock/category-for-payee"
                hx-trigger="change"
                hx-swap="none"
              />
              <datalist id="dock-payee-options">
                <option th:each="p : ${lists.payees()}" th:value="${p.entryValue()}"></option>
              </datalist>
            </div>
            <div class="field">
              <label class="field__label" for="dock-category">Category</label>
              <input
                id="dock-category"
                data-select-on-focus
                name="categoryText"
                class="input"
                list="dock-category-options"
                autocomplete="off"
                placeholder="Food  ·  or  for Max"
                th:value="${dock.input().categoryText()}"
                hx-post="/categories/resolve"
                hx-trigger="change"
                hx-target="#entry-category-resolved"
                hx-swap="innerHTML"
              />
              <datalist id="dock-category-options">
                <option th:each="c : ${lists.categories()}" th:value="${c.name()}"></option>
                <option th:each="t : ${lists.transferTargets()}" th:value="${t}"></option>
                <option th:each="p : ${lists.personTargets()}" th:value="${p}"></option>
              </datalist>
            </div>
            <div class="field">
              <label class="field__label" for="dock-note">Note</label>
              <input id="dock-note" name="note" class="input" autocomplete="off" th:value="${dock.input().note()}" />
            </div>
            <div class="field field--tags" data-tag-field>
              <label class="field__label" for="entry-tags">Tags</label>
              <div class="chips">
                <span id="entry-tag-chips" class="chips__list" data-tag-chips>
                  <th:block th:each="t : ${dock.tags()}">
                    <th:block
                      th:replace="~{fragments/entry-dock :: tagChip(tagId=${t.tagId()}, tagLabel=${t.label()}, fieldName='tagId')}"
                    ></th:block>
                  </th:block>
                </span>
                <input
                  id="entry-tags"
                  name="tagText"
                  class="input chips__input"
                  list="entry-tag-options"
                  autocomplete="off"
                  placeholder="Car:Passat"
                  data-tag-input
                  hx-post="/categories/tags/resolve"
                  hx-trigger="tag-commit"
                  hx-include="this"
                  hx-target="#entry-tag-chips"
                  hx-swap="beforeend"
                />
                <datalist id="entry-tag-options">
                  <option th:each="tl : ${lists.tagOptions()}" th:value="${tl}"></option>
                </datalist>
              </div>
            </div>
            <span id="entry-category-resolved" data-counterpart-resolved>
              <input type="hidden" name="categoryId" th:value="${dock.input().categoryId()}" />
              <input
                th:if="${dock.input().transferDirection() != null}"
                type="hidden"
                name="transferDirection"
                th:value="${dock.input().transferDirection()}"
              />
              <th:block th:if="${dock.input().personName() != null}">
                <input type="hidden" name="personName" th:value="${dock.input().personName()}" />
                <input type="hidden" name="personDirection" th:value="${dock.input().personDirection()}" />
                <input
                  th:if="${dock.input().personRevive() != null}"
                  type="hidden"
                  name="personRevive"
                  th:value="${dock.input().personRevive()}"
                />
              </th:block>
            </span>
          </div>
          <p class="actions">
            <button type="submit" class="btn btn--primary" th:text="${dock.saveLabel()}">Save and match</button>
            <a
              class="btn btn--ghost"
              th:href="@{/statements/{id}(id=${statementId})}"
              th:attr="hx-get=@{/statements/{id}/dock/close(id=${statementId})},hx-push-url=@{/statements/{id}(id=${statementId})}"
              hx-target="closest .statement-dock-row"
              hx-select="unset"
              hx-swap="delete"
              >Cancel</a
            >
            <span class="statements__error" role="alert" th:if="${dock.error() != null}" th:text="${dock.error()}">
              A category, transfer target, or person is required.
            </span>
          </p>
        </form>
      </div>
    </th:block>
    <!-- The counterpart-amount (and, when asked for, base-amount) fields of a cross-currency dock. -->
    <th:block th:fragment="crossFields(currencyCode, counterpartAmount, showBase, baseAmount)">
      <input type="hidden" name="categoryCurrencyCode" th:value="${currencyCode}" />
      <div class="field">
        <label class="field__label" for="dock-category-amount">
          Counterpart amount (<span th:text="${currencyCode}">USD</span>)
        </label>
        <input
          id="dock-category-amount"
          name="categoryAmount"
          class="input input--amount"
          th:value="${counterpartAmount}"
        />
      </div>
      <div class="field" th:if="${showBase}">
        <label class="field__label" for="dock-base-amount">Base amount</label>
        <input id="dock-base-amount" name="baseAmount" class="input input--amount" th:value="${baseAmount}" />
      </div>
    </th:block>

    <!-- GET /statements/{id}/lines/{line}/cross-currency: the fields for a transfer into another currency. -->
    <th:block th:fragment="crossFieldsFor(cross)">
      <th:block th:if="${cross != null}">
        <th:block
          th:replace="~{:: crossFields(${cross.currencyCode()}, ${cross.counterpartAmount()}, ${cross.showBase()}, ${cross.baseAmount()})}"
        ></th:block>
      </th:block>
    </th:block>

    <!-- GET /statements/dock/category-for-payee: the corrected payee's last category, as out-of-band
         fills only (the Payee input swaps nothing itself). htmx fires no swap event on an OOB
         target, so the response also sends `dock-category-filled` (HX-Trigger-After-Swap), which
         makes the cross-currency block above ask for the counterpart amounts again. -->
    <th:block th:fragment="suggestedCategory(categoryId, categoryName)">
      <th:block th:if="${categoryName}">
        <input
          id="dock-category"
          data-select-on-focus
          name="categoryText"
          class="input"
          list="dock-category-options"
          autocomplete="off"
          th:value="${categoryName}"
          hx-swap-oob="true"
          hx-post="/categories/resolve"
          hx-trigger="change"
          hx-target="#entry-category-resolved"
          hx-swap="innerHTML"
        />
        <span hx-swap-oob="innerHTML:#entry-category-resolved">
          <input type="hidden" name="categoryId" th:value="${categoryId}" />
        </span>
      </th:block>
    </th:block>
  </body>
</html>
