<!DOCTYPE html>
<!--
  "Copy to my reports" (reporting.md §14, plan stage d): a Preset is code-defined and non-deletable
  (PresetCatalog), so the only way to make it an owned, editable Report is to clone its spec into a
  new `report` row under a name of the owner's choosing. Shown only on a Preset's own page
  (ReportController sets `slug`; a saved Report's own page never does).
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <section class="panel" th:fragment="copy">
      <p class="eyebrow">Copy to my reports</p>
      <p class="muted">
        Saves a copy of this Preset as your own Report, which you can rename or remove later.
      </p>
      <form method="post" th:action="@{/reports/preset/{slug}/copy(slug=${slug})}" class="form">
        <div class="field">
          <label class="field__label" for="report-copy-name">Name</label>
          <input id="report-copy-name" name="name" type="text" class="input" required autocomplete="off" />
        </div>
        <p class="actions">
          <button type="submit" class="btn">Copy</button>
        </p>
      </form>
    </section>
  </body>
</html>
