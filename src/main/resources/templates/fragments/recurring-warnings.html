<!DOCTYPE html>
<!--
  The main page's recurring lines, lazy-loaded by landing.html via hx-get on load into its
  #recurring-warnings slot. One warning per live template whose occurrences cannot book (data-model
  §14.3, slice f), naming the reason; it clears on the first run that completes. One reminder per
  template nearing its end (slice g), from the end date minus its reminder days; Dismiss switches the
  reminder off and re-renders this fragment in place. Each line links to the template's editor, and
  the fragment renders nothing while there is nothing to say.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="warnings">
      <p class="lede" th:each="f : ${failures}">
        <span class="warning">Could not book</span>
        <a
          th:href="@{/recurring/{id}(id=${f.recurringTemplateId()})}"
          th:text="${f.name()}"
          >Streaming</a
        >: <span th:text="${f.reason()}">Account 'BankAaa-EUR' is closed</span>
        <span
          class="muted"
          th:text="'(since ' + ${#temporals.format(f.since(), 'dd.MM.yyyy')} + ')'"
          >(since 01.10.2026)</span
        >
      </p>
      <p class="lede" th:each="r : ${reminders}">
        <a th:href="@{/recurring/{id}(id=${r.recurringTemplateId()})}" th:text="${r.name()}"
          >Streaming</a
        >
        <span th:text="'ends on ' + ${#temporals.format(r.endDate(), 'dd.MM.yyyy')}"
          >ends on 31.12.2026</span
        >
        <button
          type="button"
          class="btn btn--ghost"
          th:attr="hx-post=@{/recurring/{id}/dismiss-reminder(id=${r.recurringTemplateId()})}"
          hx-target="#recurring-warnings"
        >
          Dismiss
        </button>
      </p>
    </th:block>
  </body>
</html>
