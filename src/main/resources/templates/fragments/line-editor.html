<!DOCTYPE html>
<!--
  The shared line-editor core (plan §9f): one editable line of a multi-line transaction — category /
  transfer / person target, amount, derived cross-currency cells, note, per-line tags, and remove.
  Extracted from fragments/split-panel.html so BOTH the register's split panel and the receipts
  post-process surface render the identical row, which is what makes the keyboard.js `data-split-*`
  live-remaining readout come free on both (CLAUDE.md §1.6 — the JS leaf is untouched).

  Parameters:
    • line              — a SplitLineView (index, categoryText/Id/Type, transferDirection,
                          personName/Direction/Revive, amount, note, accountAmount, baseAmount, tags)
    • currency          — the panel's SplitCurrency (crossCurrency + the currency codes / rates)
    • removeUrl         — the remove-line endpoint of the owning surface
    • panelTarget       — the hx-target the surface re-renders its whole panel into
    • categoryOptionsId — the id of the <datalist> of category / transfer / person targets
    • tagOptionsId      — the id of the <datalist> of existing tag suggestions
    • ghost             — the AI's raw target term (receipts only; null in the register): shown as a
                          grey "AI said: …" hint on an unresolved line, or a provenance tooltip when
                          the line already resolved
    • tagIndexBase      — the number of tag inputs the surface renders BEFORE the lines, so the tag
                          resolve knows which `tagText` in the whole-form submission is this line's
                          (the endpoint binds `tagText` as a list, selected by `index`). The register
                          has a header tag input first, so its lines are 1-based; the receipts editor
                          has none, so its lines are 0-based. Off-by-one here silently reads the wrong
                          (usually empty) slot, so no chip is created.

  The category/tag resolves post to the shared, parameterised /categories/resolve and
  /categories/tags/resolve exactly as the register does; only the remove endpoint/target differ per
  surface. Remove this fragment's markup and the surface's server round-trips still work — the JS is
  a live-display convenience.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <li
      class="split-line"
      th:fragment="line(line, currency, removeUrl, redistributeUrl, panelTarget, categoryOptionsId, tagOptionsId, ghost, description, tagIndexBase)"
      data-split-line
    >
      <!-- Item name (receipts only, plan §9f): the parsed line description, editable. The register
           split has no per-line description, so it passes description=null and this is not rendered. -->
      <div class="field field--split-description" th:if="${description != null}">
        <label class="field__label" th:for="'split-desc-' + ${line.index()}">Item</label>
        <input
          th:id="'split-desc-' + ${line.index()}"
          name="lineDescription"
          class="input"
          autocomplete="off"
          placeholder="Item"
          th:value="${description}"
        />
      </div>
      <div class="field field--split-category">
        <label
          class="field__label"
          th:for="'split-cat-' + ${line.index()}"
          th:title="${ghost != null and !#strings.isEmpty(line.categoryText())}
                      ? 'AI suggested: ' + ${ghost}
                      : 'Food, or Food - Milk to create a leaf. To → Account / From ← Account transfers. for Max / by Max attributes this line to a person (data-model §7).'"
          >Category</label
        >
        <input
          th:id="'split-cat-' + ${line.index()}"
          name="categoryText"
          class="input"
          autocomplete="off"
          placeholder="Category"
          th:value="${line.categoryText()}"
          hx-post="/categories/resolve"
          hx-swap="innerHTML"
          th:attr="list=${categoryOptionsId},
                   hx-target='#line-' + ${line.index()} + '-resolved',
                   hx-trigger=${!#strings.isEmpty(line.categoryText())
                                 and #strings.isEmpty(line.categoryId())
                                 and #strings.isEmpty(line.personName())}
                               ? 'change, load' : 'change',
                   hx-vals=|{&quot;fieldName&quot;:&quot;lineCategoryId&quot;,&quot;typeFieldName&quot;:&quot;lineCategoryType&quot;,&quot;directionFieldName&quot;:&quot;lineTransferDirection&quot;,&quot;personFieldPrefix&quot;:&quot;line&quot;,&quot;index&quot;:${line.index()}}|"
        />
        <!-- Why `load` on an unresolved line: what the resolve has to say — above all the pending
             create-confirm — lives only in its response, so any server-side re-render of the panel
             (a Save refused for this very line, add-line, remove-line) would drop the confirm while
             keeping the typed text, and `change` cannot bring it back because the value never
             changes. Re-resolving on load re-arms it. Only a line with text but no id fires; a
             resolved line, a transfer, a person line, and an empty line all stay quiet. -->
      </div>
      <div class="field field--amount">
        <label class="field__label" th:for="'split-amt-' + ${line.index()}">
          <span th:if="${!currency.crossCurrency()}">Amount</span>
          <span
            th:if="${currency.crossCurrency()}"
            th:text="'Amount (' + ${currency.spendingCurrencyCode()} + ')'"
            >Amount (USD)</span
          >
        </label>
        <input
          th:id="'split-amt-' + ${line.index()}"
          name="lineAmount"
          class="input num"
          inputmode="decimal"
          autocomplete="off"
          placeholder="20,00"
          th:value="${line.amount()}"
          data-split-amount
        />
      </div>
      <!-- The line's derived funding/base equivalents, read-only (register §3.8a/§3.10). Shown only
           when cross-currency; the base equivalent only when neither leg is the base. keyboard.js
           refreshes these live from the header's shared rate as the user types. -->
      <span class="split-line__derived muted" th:if="${currency.crossCurrency()}">
        ≈ <span data-split-account-cell th:text="${line.accountAmount()}">66,67</span>
        <span th:text="${currency.fundingCurrencyCode()}">CHF</span>
        <th:block th:if="${currency.neitherIsBase()}">
          · <span data-split-base-cell th:text="${line.baseAmount()}">63,33</span>
          <span th:text="${currency.baseCurrencyCode()}">EUR</span>
        </th:block>
      </span>
      <div class="field field--split-note">
        <label class="field__label" th:for="'split-note-' + ${line.index()}">Note</label>
        <input
          th:id="'split-note-' + ${line.index()}"
          name="lineNote"
          class="input"
          autocomplete="off"
          th:value="${line.note()}"
        />
      </div>
      <!-- Per-line tags (register §3.6, plan stage 7e.3): the line's own chips, pre-filled with the
           inherited transaction-level tags (visible + removable here), plus any this line adds. Each
           pill carries a hidden `lineTag{index}` id the commit submits; the resolve call names THIS
           line's target + field so the shared endpoint serves every line. -->
      <div class="field field--tags" data-tag-field>
        <label class="field__label" th:for="'split-line-' + ${line.index()} + '-tags'">Tags</label>
        <div class="chips">
          <span
            th:id="'split-line-' + ${line.index()} + '-tag-chips'"
            class="chips__list"
            data-tag-chips
          >
            <th:block th:each="t : ${line.tags()}">
              <th:block
                th:replace="~{fragments/entry-dock :: tagChip(tagId=${t.tagId()}, tagLabel=${t.label()}, fieldName='lineTag' + ${line.index()})}"
              ></th:block>
            </th:block>
          </span>
          <input
            th:id="'split-line-' + ${line.index()} + '-tags'"
            name="tagText"
            class="input chips__input"
            autocomplete="off"
            placeholder="Fuel"
            data-tag-input
            hx-post="/categories/tags/resolve"
            hx-trigger="tag-commit"
            hx-include="closest form"
            hx-swap="beforeend"
            th:attr="list=${tagOptionsId},
                     hx-target='#split-line-' + ${line.index()} + '-tag-chips',
                     hx-vals=|{&quot;fieldName&quot;:&quot;lineTag${line.index()}&quot;,&quot;index&quot;:${line.index() + tagIndexBase}}|"
          />
        </div>
      </div>
      <!-- ⇄ Redistribute (receipts only, plan §9f): spread this line over the others and remove it.
           The register does not offer it (null redistributeUrl), so the button is hidden there. -->
      <button
        th:if="${redistributeUrl != null}"
        type="button"
        class="btn btn--ghost split-line__redistribute"
        title="Spread this line over the others and remove it"
        name="index"
        th:value="${line.index()}"
        th:attr="hx-post=${redistributeUrl},hx-target=${panelTarget}"
        hx-include="closest form"
        hx-swap="outerHTML"
      >
        ⇄
      </button>
      <button
        type="button"
        class="btn btn--ghost split-line__remove"
        title="Remove line"
        name="index"
        th:value="${line.index()}"
        th:attr="hx-post=${removeUrl},hx-target=${panelTarget}"
        hx-include="closest form"
        hx-swap="outerHTML"
      >
        ✕
      </button>
      <!-- The line's status, wrapped onto its own full-width row BELOW the fields (issue
           receipt-processing/25). Everything the resolve has to say lands here — the AI ghost, the
           resolve error, the create-confirm, the person revival choice — for the reason the simple
           dock already puts its status under the fields rather than beside them: .split-line is a
           flex row, so a visible span among the fields becomes a column of its own and narrows
           every other field as it appears. Sitting on a wrapped flex line, it can say anything at
           any length without moving a field. -->
      <div class="split-line__status">
        <!-- Ghost (plan §9f): an unresolved line the AI named a target for shows that term as a grey,
             non-committing hint — which also marks a targetless transfer line for what it is. A
             resolved line carries it as the label's tooltip (above) instead. Register: ghost null. -->
        <span
          class="split-line__ghost muted"
          th:if="${ghost != null and #strings.isEmpty(line.categoryText())}"
          th:text="'AI said: ' + ${ghost}"
        >
          AI said: Food - Sweets
        </span>
        <!-- This line's resolved category id + type + transfer direction + person attribution
             (hidden), filled by /categories/resolve — plus whatever status that resolve renders.
             The type feeds the live signed-sum readout; the direction signs a transfer line, which
             has no category type (register §3.8, plan stage 7d.3), and the person direction does the
             same for a `for`/`by` line (register §3.5, plan stage 8b.2) — whose person is carried by
             NAME, its debt leaf provisioned at commit. Every line emits all of them (blank for a
             category) so the aligned line arrays stay aligned across a per-line re-resolve. -->
        <span
          th:id="'line-' + ${line.index()} + '-resolved'"
          data-counterpart-resolved
        >
          <input type="hidden" name="lineCategoryId" th:value="${line.categoryId()}" />
          <input type="hidden" name="lineCategoryType" th:value="${line.categoryType()}" />
          <input type="hidden" name="lineTransferDirection" th:value="${line.transferDirection()}" />
          <input type="hidden" name="linePersonName" th:value="${line.personName()}" />
          <input type="hidden" name="linePersonDirection" th:value="${line.personDirection()}" />
          <input type="hidden" name="linePersonRevive" th:value="${line.personRevive()}" />
        </span>
      </div>
    </li>
  </body>
</html>
