<!DOCTYPE html>
<!--
  A saved Report's rename/duplicate/delete actions (reporting.md §14, plan stage d) — shown only
  when the enclosing page set the `savedReport` model attribute (a Preset's own page never does; a
  saved Report's own page, SavedReportController, always does). Standard server-rendered form POSTs
  with redirect-after-post; no bespoke JS, matching every other reference-data edit screen.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <section class="panel" th:if="${savedReport != null}" th:fragment="manage">
      <p class="eyebrow">Manage this report</p>

      <form
        method="post"
        th:action="@{/reports/{id}/rename(id=${savedReport.reportId()})}"
        class="form"
      >
        <div class="field">
          <label class="field__label" th:for="${'report-name-' + savedReport.reportId()}">Name</label>
          <input
            th:id="${'report-name-' + savedReport.reportId()}"
            name="name"
            type="text"
            class="input"
            th:value="${savedReport.name()}"
            required
            autocomplete="off"
          />
        </div>
        <p class="actions">
          <button type="submit" class="btn">Rename</button>
        </p>
      </form>

      <form
        method="post"
        th:action="@{/reports/{id}/duplicate(id=${savedReport.reportId()})}"
        class="form"
      >
        <div class="field">
          <label class="field__label" th:for="${'report-duplicate-' + savedReport.reportId()}"
            >Duplicate as</label
          >
          <input
            th:id="${'report-duplicate-' + savedReport.reportId()}"
            name="name"
            type="text"
            class="input"
            th:value="${savedReport.name() + ' copy'}"
            required
            autocomplete="off"
          />
        </div>
        <p class="actions">
          <button type="submit" class="btn">Duplicate</button>
        </p>
      </form>

      <form
        method="post"
        th:action="@{/reports/{id}/delete(id=${savedReport.reportId()})}"
        class="form"
      >
        <p class="actions">
          <button type="submit" class="btn btn--danger">Delete report</button>
        </p>
      </form>
    </section>
  </body>
</html>
