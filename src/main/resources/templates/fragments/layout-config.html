<!DOCTYPE html>
<!--
  The reporting page's Layout editor (reporting.md §11, plan stage d2): rows x columns and a
  picker per Frame, each above its own live-rendered preview (fragments/frame.html, shared with the
  read-only /reports page so the two cannot drift on how a Frame looks). Resizing the grid
  (hx-post on change, carrying every current field via hx-include) only re-renders this fragment in
  place; nothing is persisted until "Save layout" posts the same form's current values to
  /reports/layout and writes the whole grid at once, navigating to /reports via the HX-Redirect
  response header (ReceiptProcessingController's confirm-and-advance idiom) rather than a real form
  submit — a plain submit button would make Enter in the Rows/Columns number inputs (which only
  resize on `change`/blur, not Enter) submit the stale, not-yet-resized field set. "Cancel" is a
  plain link back, so neither action ever needs to distinguish an unsaved resize from a persisted
  one.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <section class="panel" id="layout-config" th:fragment="config">
      <p class="eyebrow">Edit layout</p>
      <form>
        <div class="layout-dimensions">
          <div class="field">
            <label class="field__label" for="layout-rows">Rows</label>
            <input
              id="layout-rows"
              name="rowCount"
              type="number"
              min="1"
              class="input"
              th:value="${rowCount}"
              th:attr="hx-post=@{/reports/layout/resize}"
              hx-trigger="change"
              hx-include="closest form"
              hx-target="#layout-config"
              hx-swap="outerHTML"
            />
          </div>
          <div class="field">
            <label class="field__label" for="layout-columns">Columns</label>
            <input
              id="layout-columns"
              name="columnCount"
              type="number"
              min="1"
              class="input"
              th:value="${columnCount}"
              th:attr="hx-post=@{/reports/layout/resize}"
              hx-trigger="change"
              hx-include="closest form"
              hx-target="#layout-config"
              hx-swap="outerHTML"
            />
          </div>
          <button
            type="button"
            class="btn"
            th:attr="hx-post=@{/reports/layout}"
            hx-include="closest form"
          >
            Save layout
          </button>
          <a class="btn btn--ghost" th:href="@{/reports}">Cancel</a>
        </div>

        <div
          class="layout-grid"
          th:style="'grid-template-columns: repeat(' + ${columnCount} + ', 1fr)'"
        >
          <div class="layout-frame" th:each="frame : ${frames}">
            <select
              th:name="${frame.fieldName()}"
              class="input"
              th:attr="hx-post=@{/reports/layout/resize}"
              hx-trigger="change"
              hx-include="closest form"
              hx-target="#layout-config"
              hx-swap="outerHTML"
            >
              <option th:if="${!frame.configured()}" value="" selected disabled hidden>
                Choose a report…
              </option>
              <optgroup label="Presets">
                <option
                  th:each="opt : ${presetOptions}"
                  th:value="${'preset:' + opt.slug()}"
                  th:text="${opt.title()}"
                  th:selected="${('preset:' + opt.slug()) == frame.selectedValue()}"
                >
                  Preset
                </option>
              </optgroup>
              <optgroup label="My reports" th:unless="${#lists.isEmpty(savedReportOptions)}">
                <option
                  th:each="saved : ${savedReportOptions}"
                  th:value="${'report:' + saved.reportId()}"
                  th:text="${saved.name()}"
                  th:selected="${('report:' + saved.reportId()) == frame.selectedValue()}"
                >
                  Report
                </option>
              </optgroup>
            </select>

            <div th:replace="~{fragments/frame :: frame(frame=${frame})}"></div>
          </div>
        </div>
      </form>
    </section>
  </body>
</html>
