<!DOCTYPE html>
<!--
  The reporting page's own Layout (reporting.md §11, plan stage c part 2): a configurable rows x
  columns grid of Frames, each a picker plus its live rendered Preset — fragments/main-frame.html's
  card, generalised to N Frames instead of the main page's one. Resizing the grid (hx-post on change,
  carrying every current field via hx-include) only re-renders this fragment in place; nothing is
  persisted until "Save layout" posts the same form's current values and writes the whole grid at
  once (the settle-up account picker's hx-include idiom, reused here for a form that keeps growing).
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <section class="panel" id="layout-config" th:fragment="config">
      <p class="eyebrow">Layout</p>
      <form>
        <div class="layout-dimensions">
          <div class="field">
            <label class="field__label" for="layout-rows">Rows</label>
            <input
              id="layout-rows"
              name="rowCount"
              type="number"
              min="1"
              class="input"
              th:value="${rowCount}"
              th:attr="hx-post=@{/reports/layout/resize}"
              hx-trigger="change"
              hx-include="closest form"
              hx-target="#layout-config"
              hx-swap="outerHTML"
            />
          </div>
          <div class="field">
            <label class="field__label" for="layout-columns">Columns</label>
            <input
              id="layout-columns"
              name="columnCount"
              type="number"
              min="1"
              class="input"
              th:value="${columnCount}"
              th:attr="hx-post=@{/reports/layout/resize}"
              hx-trigger="change"
              hx-include="closest form"
              hx-target="#layout-config"
              hx-swap="outerHTML"
            />
          </div>
          <button
            type="button"
            class="btn"
            th:attr="hx-post=@{/reports/layout}"
            hx-include="closest form"
            hx-target="#layout-config"
            hx-swap="outerHTML"
          >
            Save layout
          </button>
        </div>

        <div
          class="layout-grid"
          th:style="'grid-template-columns: repeat(' + ${columnCount} + ', 1fr)'"
        >
          <div class="panel layout-frame" th:each="frame : ${frames}">
            <select
              th:name="${frame.fieldName()}"
              class="input"
              th:attr="hx-post=@{/reports/layout/resize}"
              hx-trigger="change"
              hx-include="closest form"
              hx-target="#layout-config"
              hx-swap="outerHTML"
            >
              <option th:if="${!frame.configured()}" value="" selected disabled hidden>
                Choose a report…
              </option>
              <option
                th:each="opt : ${presetOptions}"
                th:value="${opt.slug()}"
                th:text="${opt.title()}"
                th:selected="${opt.slug() == frame.selectedSlug()}"
              >
                Preset
              </option>
            </select>

            <p th:unless="${frame.configured()}" class="muted">No report configured.</p>
            <div th:if="${frame.configured() and frame.baseCurrencyUnset()}">
              <p th:replace="~{fragments/base-currency-prompt :: prompt}">
                Set the base currency first.
              </p>
            </div>

            <div th:if="${frame.report() != null}" th:with="report=${frame.report()}">
              <table th:replace="~{fragments/report-table-body :: body}"></table>
            </div>
            <div th:if="${frame.chart() != null}" th:with="chart=${frame.chart()}">
              <div th:replace="~{fragments/chart-panels :: panels}"></div>
            </div>
          </div>
        </div>
      </form>
    </section>
  </body>
</html>
