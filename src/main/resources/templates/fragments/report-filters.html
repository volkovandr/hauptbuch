<!DOCTYPE html>
<!--
  The Filters settings-strip group (reporting.md §11a.5, plan stage d3-4): one fixed section per
  field — Category, Account, Tag (hierarchy pickers, filter-groups.js's node mode), Payee, Person,
  Currency, Account type, reconciliation and note text. An empty section is no filter — a field's own
  <form> always resubmits its own filterField/level/op markers regardless of whether anything is
  ticked, and ReportSpecQueryString degrades an empty value list to "no filter for this field"
  (rather than the record's own "needs at least one value" rejection).

  Every section is its own Apply group (reporting.md §11a.3: a checkbox group's intermediate states
  are not what the operator wants to see), same idiom as Measures/Scope's account types in
  report-settings.html — GETting the page's own URL with the whole editable state as hidden fields
  (`section.otherParams()`, built server-side in ReportFilterView so a section never has to know
  another section's or another group's field names) alongside the section's own real inputs.
-->
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div th:fragment="filters">
      <div th:replace="~{::hierarchy(${filters.category()}, 'CATEGORY', 'filter-category')}"></div>
      <div th:replace="~{::hierarchy(${filters.account()}, 'ACCOUNT', 'filter-account')}"></div>
      <div th:replace="~{::hierarchy(${filters.tag()}, 'TAG', 'filter-tag')}"></div>
      <div th:replace="~{::payee(${filters.payee()})}"></div>
      <div th:replace="~{::option(${filters.person()}, 'PERSON')}"></div>
      <div th:replace="~{::option(${filters.currency()}, 'CURRENCY')}"></div>
      <div th:replace="~{::option(${filters.accountType()}, 'ACCOUNT_TYPE')}"></div>
      <div th:replace="~{::option(${filters.reconciliation()}, 'RECONCILIATION')}"></div>
      <div th:replace="~{::note(${filters.note()})}"></div>
    </div>

    <!-- Category / Account / Tag: a hierarchy tree, filter-groups.js's node mode. Ticking a node
         stores that node alone (§6.3's subtree rule); its descendants render ticked and disabled,
         both server-side (from the spec already in effect) and live as the operator ticks another
         node, before Apply. -->
    <div class="report-settings__filter" th:fragment="hierarchy(section, field, idPrefix)">
      <p class="report-settings__filter-label" th:text="${section.label()}">Category</p>
      <form
        class="report-settings__form"
        method="get"
        th:action="@{${settings.pagePath()}}"
        hx-target="#report-page"
        hx-swap="outerHTML"
        hx-replace-url="true"
        th:attr="hx-get=@{${settings.pagePath()}}"
      >
        <p
          class="report-settings__filter-switch"
          th:with="help=${T(volkovandr.hauptbuch.analytics.ReportHelpText).FILTER_READING_SWITCH}"
        >
          <label class="check">
            <input
              type="radio"
              th:name="${'filter.' + field + '.level'}"
              value="TRANSACTION"
              th:checked="${section.transactionLevel()}"
            />
            only transactions touching …
          </label>
          <label class="check">
            <input
              type="radio"
              th:name="${'filter.' + field + '.level'}"
              value="POSTING"
              th:checked="${!section.transactionLevel()}"
            />
            only amounts booked to …
          </label>
          <span th:replace="~{fragments/help-marker :: marker(${help})}"></span>
        </p>
        <input type="hidden" name="filterField" th:value="${field}" />
        <input type="hidden" th:name="${'filter.' + field + '.op'}" value="IS_ONE_OF" />
        <ul
          class="report-settings__filter-tree"
          data-filter-groups
          data-filter-mode="node"
          th:id="${idPrefix}"
        >
          <li th:each="node : ${section.nodes()}" th:style="'--depth: ' + ${node.depth()}">
            <label class="check">
              <input
                type="checkbox"
                th:name="${'filter.' + field + '.value'}"
                th:value="${node.value()}"
                th:checked="${node.ticked()}"
                th:disabled="${node.disabled()}"
                th:attr="data-filter-node=${node.value()}, data-filter-ancestors=${node.ancestors()}"
              />
              <span th:text="${node.label()}">Food</span>
            </label>
          </li>
        </ul>
        <th:block
          th:replace="~{fragments/report-actions :: hidden-fields(${section.otherParams()})}"
        ></th:block>
        <p class="actions"><button type="submit" class="btn">Apply</button></p>
      </form>
    </div>

    <!-- Person / Currency / Account type / reconciliation: a flat multi-select. Account type has no
         reading switch (§6.2's exception — scope's own account types already say what its
         posting-level reading would mean), so its level is a fixed hidden field instead. -->
    <div class="report-settings__filter" th:fragment="option(section, field)">
      <p class="report-settings__filter-label" th:text="${section.label()}">Person</p>
      <form
        class="report-settings__form"
        method="get"
        th:action="@{${settings.pagePath()}}"
        hx-target="#report-page"
        hx-swap="outerHTML"
        hx-replace-url="true"
        th:attr="hx-get=@{${settings.pagePath()}}"
      >
        <p
          class="report-settings__filter-switch"
          th:if="${section.showLevelSwitch()}"
          th:with="help=${T(volkovandr.hauptbuch.analytics.ReportHelpText).FILTER_READING_SWITCH}"
        >
          <label class="check">
            <input
              type="radio"
              th:name="${'filter.' + field + '.level'}"
              value="TRANSACTION"
              th:checked="${section.transactionLevel()}"
            />
            only transactions touching …
          </label>
          <label class="check">
            <input
              type="radio"
              th:name="${'filter.' + field + '.level'}"
              value="POSTING"
              th:checked="${!section.transactionLevel()}"
            />
            only amounts booked to …
          </label>
          <span th:replace="~{fragments/help-marker :: marker(${help})}"></span>
        </p>
        <input
          type="hidden"
          th:unless="${section.showLevelSwitch()}"
          th:name="${'filter.' + field + '.level'}"
          value="TRANSACTION"
        />
        <input type="hidden" name="filterField" th:value="${field}" />
        <input type="hidden" th:name="${'filter.' + field + '.op'}" value="IS_ONE_OF" />
        <ul class="report-settings__filter-options">
          <li th:each="opt : ${section.options()}">
            <label class="check">
              <input
                type="checkbox"
                th:name="${'filter.' + field + '.value'}"
                th:value="${opt.value()}"
                th:checked="${opt.ticked()}"
              />
              <span th:text="${opt.label()}">Asset</span>
            </label>
          </li>
        </ul>
        <th:block
          th:replace="~{fragments/report-actions :: hidden-fields(${section.otherParams()})}"
        ></th:block>
        <p class="actions"><button type="submit" class="btn">Apply</button></p>
      </form>
    </div>

    <!-- Payee: an id checklist (operator "is one of") or a case-insensitive regex (operator
         "matches") — both always in the DOM, a CSS-only radio switch shows the relevant one (§6.3),
         mirroring the date-range endpoint fields' own "both always submitted, only one decoded"
         idiom. No reading switch (§6.2's first exception — payee is a transaction attribute). -->
    <div class="report-settings__filter report-settings__filter-payee" th:fragment="payee(section)">
      <p class="report-settings__filter-label">Payee</p>
      <form
        class="report-settings__form"
        method="get"
        th:action="@{${settings.pagePath()}}"
        hx-target="#report-page"
        hx-swap="outerHTML"
        hx-replace-url="true"
        th:attr="hx-get=@{${settings.pagePath()}}"
      >
        <p class="report-settings__filter-switch">
          <label class="check">
            <input
              type="radio"
              name="filter.PAYEE.op"
              value="IS_ONE_OF"
              class="payee-mode-is-one-of"
              th:checked="${!section.matchesOperator()}"
            />
            is one of
          </label>
          <label class="check">
            <input
              type="radio"
              name="filter.PAYEE.op"
              value="MATCHES"
              class="payee-mode-matches"
              th:checked="${section.matchesOperator()}"
            />
            matches (regular expression)
          </label>
        </p>
        <input type="hidden" name="filterField" value="PAYEE" />
        <input type="hidden" name="filter.PAYEE.level" value="TRANSACTION" />
        <ul class="report-settings__filter-options payee-is-one-of">
          <li th:each="opt : ${section.options()}">
            <label class="check">
              <input
                type="checkbox"
                name="filter.PAYEE.value"
                th:value="${opt.value()}"
                th:checked="${opt.ticked()}"
              />
              <span th:text="${opt.label()}">ShopAaa</span>
            </label>
          </li>
        </ul>
        <p class="payee-matches">
          <input
            type="text"
            name="filter.PAYEE.matches"
            class="input"
            th:value="${section.regex()}"
            placeholder="Regular expression"
            autocomplete="off"
          />
        </p>
        <th:block
          th:replace="~{fragments/report-actions :: hidden-fields(${section.otherParams()})}"
        ></th:block>
        <p class="actions"><button type="submit" class="btn">Apply</button></p>
      </form>
    </div>

    <!-- Note text: a single "contains" substring, no reading switch (§6.2's second exception). -->
    <div class="report-settings__filter report-settings__filter-note" th:fragment="note(section)">
      <p class="report-settings__filter-label">Note text</p>
      <form
        class="report-settings__form"
        method="get"
        th:action="@{${settings.pagePath()}}"
        hx-target="#report-page"
        hx-swap="outerHTML"
        hx-replace-url="true"
        th:attr="hx-get=@{${settings.pagePath()}}"
      >
        <input type="hidden" name="filterField" value="NOTE" />
        <input type="hidden" name="filter.NOTE.level" value="TRANSACTION" />
        <input type="hidden" name="filter.NOTE.op" value="CONTAINS" />
        <p>
          <input
            type="text"
            name="filter.NOTE.value"
            class="input"
            th:value="${section.value()}"
            placeholder="Contains…"
            autocomplete="off"
          />
        </p>
        <th:block
          th:replace="~{fragments/report-actions :: hidden-fields(${section.otherParams()})}"
        ></th:block>
        <p class="actions"><button type="submit" class="btn">Apply</button></p>
      </form>
    </div>
  </body>
</html>
