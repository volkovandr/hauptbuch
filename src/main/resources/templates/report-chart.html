<!DOCTYPE html>
<!--
  A Report's rendered chart (plan stage b, reporting.md §10; the editor is stage d3): line/bar/pie,
  server-rendered inline SVG (ChartSvgWriter), no charting library, no fourth JS leaf. Panels are
  small multiples — one per row dimension value, or one per series legend entry — see
  ChartViewAssembler. Shared by a Preset's own page (ReportController), a saved Report's own page
  (SavedReportController) and a not-yet-saved /reports/new draft (ReportEditorController) — all
  three populate `settings` (fragments/report-settings) and `editor` (fragments/report-actions)
  identically (PresetRendering). `page` is the whole settings-strip+frame+actions region every
  settings-strip control re-GETs and swaps via htmx (`#report-page`, outerHTML), including the
  Renderer dropdown itself — switching to TABLE swaps this whole page for report-table.html's own,
  superseding the old chart/table toggle (reporting.md §11a.2, plan stage d3).
-->
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: page(~{:: content})}"
>
  <main class="content" th:fragment="content">
    <div id="report-page" th:fragment="page">
      <div th:replace="~{fragments/report-settings :: strip}"></div>

      <section class="panel" id="report-frame" th:fragment="frame">
        <p class="eyebrow" th:text="${chart.title()}">Report</p>
        <p class="muted report__scope" th:text="${chart.scopeLine()}">Scope</p>
        <p class="muted">
          <span th:text="${#temporals.format(chart.resolvedStart(), 'dd.MM.yyyy')}">start</span>
          &ndash;
          <span th:text="${#temporals.format(chart.resolvedEnd(), 'dd.MM.yyyy')}">end</span>
        </p>

        <div th:replace="~{fragments/chart-panels :: panels}"></div>
      </section>

      <div th:replace="~{fragments/report-actions :: actions}"></div>
    </div>
  </main>
</html>
