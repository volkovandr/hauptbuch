<!DOCTYPE html>
<!--
  A Report's rendered chart (plan stage b, reporting.md §10; the editor actions are stage d3):
  line/bar/pie, server-rendered inline SVG (ChartSvgWriter), no charting library, no fourth JS leaf.
  Panels are small multiples — one per row dimension value, or one per series legend entry — see
  ChartViewAssembler. The toggle button swaps to the same Report's table in place (§10's chart/table
  swap), the same hx-get/hx-swap idiom the receipt image toggle uses. Shared by a Preset's own page
  (ReportController) and a saved Report's own page (SavedReportController) — both populate `editor`
  (fragments/report-actions) and `viewToggleUrl` identically (PresetRendering); a not-yet-saved
  /reports/new draft always starts TABLE-only, so it never renders here.
-->
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: page(~{:: content})}"
>
  <main class="content" th:fragment="content">
    <section class="panel" id="report-frame" th:fragment="frame">
      <p class="eyebrow" th:text="${chart.title()}">Report</p>
      <p class="muted report__scope" th:text="${chart.scopeLine()}">Scope</p>
      <p class="muted">
        <span th:text="${#temporals.format(chart.resolvedStart(), 'dd.MM.yyyy')}">start</span>
        &ndash;
        <span th:text="${#temporals.format(chart.resolvedEnd(), 'dd.MM.yyyy')}">end</span>
      </p>
      <button
        type="button"
        class="btn btn--ghost"
        hx-target="#report-frame"
        hx-swap="outerHTML"
        th:attr="hx-get=@{${viewToggleUrl}}, hx-replace-url=@{${canonicalUrl}}"
      >
        Show table
      </button>

      <div th:replace="~{fragments/chart-panels :: panels}"></div>
    </section>

    <div th:replace="~{fragments/report-actions :: actions}"></div>
  </main>
</html>
