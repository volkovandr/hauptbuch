<!DOCTYPE html>
<!--
  Transaction register (plan stage 7a) + the entry dock (7b): the newest-at-bottom list of postings
  to the viewed accounts, with a persistent bottom entry dock for new transactions.

    • A row is one posting to a viewed account (register §2.4). Columns are fixed
      (colour spine · Date · Account · Payee · Category · Amount · Balance · status — §2.5).
    • Same-hue zebra from the account's stored hue (§2.8): two shades of one hue, alternated per
      account thread — the tint tells you which balance thread a number belongs to.
    • German money (§2.9): base bare, non-base with symbol. Income green; negative balances red;
      pending_review rows muted with a — balance (§2.10).
    • Newest at the bottom (§2.1): the page scrolls to the bottom on load (keyboard.js leaf), so
      "now" and the entry dock are co-located.

  Filters (§2.3): date range (default last 12 months), account multi-select, payee — a plain GET
  form; the same view re-renders. Sorting is deferred (plan §14); order is fixed date-ascending.

  The entry dock (7b) hx-posts to /register/entry (the commit endpoint lives in operations — plan
  stage 7 boundary note). On commit the whole rows body re-renders for the active filter (a bounded
  re-fetch — the Q-UI-5 fallback, §2.2), so a backdated insert re-threads every affected balance
  below it, not just the newest row. The dock's rows fragment is reused verbatim by that response.
-->
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: page(~{:: content})}"
>
  <main class="content" th:fragment="content">
<!--    <div class="leaf-head">-->
<!--      <p class="eyebrow">Register</p>-->
<!--      <h1>Transaction register</h1>-->
<!--      <p class="lede">-->
<!--        Your accounts, threaded by date — oldest at the top, newest at the bottom, each account-->
<!--        keeping its own running balance.-->
<!--      </p>-->
<!--    </div>-->

    <form class="register-filter" data-filter-tidy-up-all method="get" th:action="@{/register}">
      <!-- The account filter (register §2.3, issue transaction-register-ui/22): a one-line tab strip
           of five pickers over a collapsible panel. Clicking a tab htmx-swaps THIS control only
           (`filterControl`) — no register query runs; only Apply re-renders the rows. The panel
           degrades to plain `name="accountId"` checkboxes that still submit with Apply when JS is
           off. Group toggles (parent accounts, person names) are driven by the `filter-groups.js`
           leaf (group mode) via the data-attributes below; `data-filter-tidy-up-all` opts this form
           into the all-ticked-means-omit-the-filter tidy-up on submit. -->
      <div id="register-filter-control" th:fragment="filterControl">
        <!-- The active picker, carried so Apply submits it. It lives INSIDE this fragment so a tab
             switch (which htmx-swaps the whole fragment) keeps it in step with the visible tab. -->
        <input
          type="hidden"
          name="picker"
          th:value="${filterView.panel().pickerParam()}"
        />
        <!-- Tabs are <a>, not submit buttons: a submit button would fire a native form GET
             alongside the htmx swap. The picker is a PATH segment because htmx drops the query
             string from a hx-get URL. The href is the JS-off fallback (a full reload). -->
        <nav class="register-filter__tabs" aria-label="Account filter">
          <a
            th:each="tab : ${filterView.tabs()}"
            class="register-filter__tab"
            th:classappend="${tab.active()} ? 'register-filter__tab--active'"
            th:href="@{/register(picker=${tab.param()})}"
            th:attr="hx-get=@{/register/filter-panel/{p}(p=${tab.param()})},
                     aria-current=${tab.active()} ? 'true' : null"
            hx-target="#register-filter-control"
            hx-swap="outerHTML"
            hx-include="[name='fromDate'], [name='toDate']"
          >
            <span th:text="${tab.label()}">Last used</span>
            <span
              class="register-filter__count"
              th:if="${tab.tickedCount() != null}"
              th:text="'(' + ${tab.tickedCount()} + ')'"
              >(19)</span
            >
          </a>
        </nav>

        <details
          class="register-filter__panel"
          data-filter-groups
          th:attr="open=${filterView.panel().expanded()} ? 'open' : null"
        >
          <summary class="register-filter__panel-toggle">Choose accounts</summary>
          <p class="register-filter__bulk">
            <button type="button" class="link" data-filter-all>All</button>
            <span aria-hidden="true">·</span>
            <button type="button" class="link" data-filter-none>None</button>
          </p>
          <!-- Two columns: real accounts on the left, people on the right. One column is empty for
               Open (no people) and Persons (no accounts); All / Last used show both, and Closed
               grows a people column once a soft-deleted person still owns a live leaf (issue
               transaction-register-ui/23). Both <ul>s live inside [data-filter-groups], so
               filter-groups.js sees every checkbox regardless of column. -->
          <div
            class="register-filter__cols"
            th:classappend="${!filterView.panel().accountRows().isEmpty()
              and !filterView.panel().personRows().isEmpty()} ? 'register-filter__cols--split'"
          >
            <ul
              class="register-filter__list"
              th:if="${!filterView.panel().accountRows().isEmpty()}"
            >
              <th:block th:each="row : ${filterView.panel().accountRows()}">
                <li th:replace="~{fragments/register-filter :: row(${row})}"></li>
              </th:block>
            </ul>
            <ul
              class="register-filter__list"
              th:if="${!filterView.panel().personRows().isEmpty()}"
            >
              <th:block th:each="row : ${filterView.panel().personRows()}">
                <li th:replace="~{fragments/register-filter :: row(${row})}"></li>
              </th:block>
            </ul>
          </div>
        </details>
      </div>

      <div class="register-filter__row">
        <div class="field">
          <label class="field__label" for="fromDate">From</label>
          <input
            id="fromDate"
            name="fromDate"
            type="date"
            class="input"
            th:value="${register.filter().fromDate()}"
          />
        </div>
        <div class="field">
          <label class="field__label" for="toDate">To</label>
          <input
            id="toDate"
            name="toDate"
            type="date"
            class="input"
            th:value="${register.filter().toDate()}"
          />
        </div>
        <div class="field">
          <label class="field__label" for="payeeId">Payee</label>
          <select id="payeeId" name="payeeId" class="input">
            <option value="">— all payees —</option>
            <option
              th:each="p : ${register.payees()}"
              th:value="${p.payeeId()}"
              th:selected="${p.selected()}"
              th:text="${p.name()}"
            >
              Rewe
            </option>
          </select>
        </div>
        <p class="actions">
          <!-- Applies the picker carried by the hidden field inside #register-filter-control,
               which a tab switch keeps current. -->
          <button type="submit" class="btn">Apply</button>
        </p>
      </div>
    </form>

    <!-- The whole rows region is a named fragment (a div, not a bare tbody) so the commit response
         can re-render it wholesale for the active filter (bounded re-fetch, §2.2). It must be a
         parse-safe top-level element: a bare <tbody> in an htmx response is discarded by the HTML
         parser (a tbody outside a table is invalid), so the swap target is this div. -->
    <div id="register-body" th:fragment="rows(register)">
      <p class="muted" th:if="${#lists.isEmpty(register.rows())}" id="register-empty">
        No transactions in this view. Enter one below, or widen the date range.
      </p>

      <div class="register-scroll" data-scroll-bottom th:unless="${#lists.isEmpty(register.rows())}">
        <table class="register">
          <thead>
            <tr>
              <th class="register__spine" aria-hidden="true"></th>
              <th scope="col">Date</th>
              <th scope="col">Account</th>
              <th scope="col">Payee</th>
              <th scope="col">Category</th>
              <th scope="col" class="num">Amount</th>
              <th scope="col" class="num">Balance</th>
              <th scope="col" class="register__status">
                <span class="visually-hidden">Status</span>
              </th>
            </tr>
          </thead>
          <tbody id="register-rows" data-kbd-list>
            <th:block th:each="r : ${register.rows()}">
              <tr th:replace="~{fragments/register-row :: row(${r}, false)}"></tr>
            </th:block>
        </tbody>
      </table>
      </div>
    </div>

    <!-- The persistent entry dock (register §3). Included from its own fragment so the commit
         response can re-render it (reset to a fresh new-transaction state). -->
    <div
      th:replace="~{fragments/entry-dock :: dock(${register}, false, null, ${amountFields})}"
    ></div>
    <!-- The category-currency picker's add-currency dialog mount (plan stage 7d.1) — outside the
         dock's own <form>: the dialog carries its own <form>, and nesting forms is invalid HTML
         (the 6d precedent, accounts.html). Stable by id, so it survives every dock re-render. -->
    <div
      th:replace="~{fragments/currency-picker :: dialogMount('entry-category-currency')}"
    ></div>

    <!-- The receipt→register jump (register §7, plan stage 9g): arriving with ?selected=<txn>, the
         controller has already derived the filter from that transaction (so its row is on screen and
         marked), and this loads it into the dock's edit mode the moment the page settles — the same
         endpoint the row's own ✎ calls, carrying the same active-filter fields. Remove this and the
         jump still lands on the right row; only the dock stays empty. -->
    <span
      th:if="${selectedTransactionId != null}"
      th:attr="hx-get=@{/register/edit/{id}(id=${selectedTransactionId})}"
      hx-trigger="load"
      hx-include="[name='viewAccountId'], [name='viewPicker'], [name='viewFromDate'], [name='viewToDate'], [name='viewPayeeId']"
      hx-target="#entry-dock"
      hx-swap="outerHTML"
    ></span>
  </main>
</html>
