<!DOCTYPE html>
<!--
  Reporting page (reporting.md §11, plan stage d2): the Layout read-only — its Frames and nothing
  else, no rows/columns inputs, no dropdowns (fragments/frame.html, shared with the editor at
  /reports/layout so the two cannot drift) — then the My reports and Presets lists, then Edit
  layout. Reworks stage c/d's screen, which carried the Layout's editing controls inline; a Report
  is made either from scratch (New report, /reports/new) or from a Preset's own page's "Save as new
  report" action (reporting.md §11a.1, plan stage d3).
-->
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: page(~{:: content})}"
>
  <main class="content" th:fragment="content">
    <div
      class="layout-grid"
      th:style="'grid-template-columns: repeat(' + ${columnCount} + ', 1fr)'"
    >
      <div class="layout-frame" th:each="frame : ${frames}">
        <div th:replace="~{fragments/frame :: frame(frame=${frame})}"></div>
      </div>
    </div>

    <section class="panel">
      <p class="eyebrow">My reports</p>
      <p class="muted" th:if="${#lists.isEmpty(savedReports)}">
        No saved reports yet — start one below, or open a Preset and use "Save as new report".
      </p>
      <ul class="reports-list" th:unless="${#lists.isEmpty(savedReports)}">
        <li th:each="saved : ${savedReports}">
          <a th:href="@{/reports/{id}(id=${saved.reportId()})}" th:text="${saved.name()}">My report</a>
        </li>
      </ul>
      <p class="actions">
        <a class="btn" th:href="@{/reports/new}">New report</a>
      </p>
    </section>

    <section class="panel">
      <p class="eyebrow">Presets</p>
      <ul class="reports-list">
        <li th:each="preset : ${presets}">
          <a th:href="@{/reports/preset/{slug}(slug=${preset.slug()})}" th:text="${preset.title()}"
            >Preset</a
          >
        </li>
      </ul>
    </section>

    <p class="actions">
      <a class="btn" th:href="@{/reports/layout}">Edit layout</a>
    </p>
  </main>
</html>
