<!DOCTYPE html>
<!--
  Reporting page (plan stage c part 2): New report (a placeholder until stage d's ad-hoc builder
  exists), the list of saved Reports (empty until stage d), and the page's own configurable Layout
  (fragments/layout-config.html, reporting.md §11). The stage-b flat Presets list is superseded by
  the Layout — its Frames reach the same Presets via their own picker.
-->
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: page(~{:: content})}"
>
  <main class="content" th:fragment="content">
    <section class="panel">
      <p class="eyebrow">Reports</p>
      <p>
        <button type="button" class="btn" disabled title="Coming once Reports can be saved">
          New report
        </button>
      </p>
      <ul class="reports-list">
        <li class="muted">No saved reports yet.</li>
      </ul>
    </section>

    <div th:replace="~{fragments/layout-config :: config}"></div>
  </main>
</html>
