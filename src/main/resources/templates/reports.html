<!DOCTYPE html>
<!--
  Reporting page (plan stage c part 2; the saved-Report list is stage d): the list of saved Reports,
  and the page's own configurable Layout (fragments/layout-config.html, reporting.md §11). The
  stage-b flat Presets list is superseded by the Layout — its Frames reach the same Presets via
  their own picker. A Report is made by opening a Preset and using its "Copy to my reports" action
  (fragments/report-copy.html) — there is no free-form spec builder yet.
-->
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: page(~{:: content})}"
>
  <main class="content" th:fragment="content">
    <section class="panel">
      <p class="eyebrow">Reports</p>
      <p class="muted" th:if="${#lists.isEmpty(savedReports)}">
        No saved reports yet — pick a Preset in a Frame below, click "Open full report", then use
        "Copy to my reports" to start one.
      </p>
      <ul class="reports-list" th:unless="${#lists.isEmpty(savedReports)}">
        <li th:each="saved : ${savedReports}">
          <a th:href="@{/reports/{id}(id=${saved.reportId()})}" th:text="${saved.name()}">My report</a>
        </li>
      </ul>
    </section>

    <div th:replace="~{fragments/layout-config :: config}"></div>
  </main>
</html>
