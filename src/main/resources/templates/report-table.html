<!DOCTYPE html>
<!--
  A Report's rendered table (plan stage b; the saved-Report actions are stage d): the grid renderer
  — no expansion (stage e). Every cell is already display-formatted text (ReportTableViewAssembler);
  blank means no postings, "—" means the aggregate is arithmetically meaningless (reporting.md §7).
  A chart Report offers a toggle back to its own renderer (§10's chart/table swap), the same
  hx-get/hx-swap idiom the receipt image toggle uses. Shared by a Preset's own page (ReportController,
  {@code slug} set, offering "Copy to my reports") and a saved Report's own page
  (SavedReportController, {@code savedReport} set, offering rename/duplicate/delete).
-->
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: page(~{:: content})}"
>
  <main class="content" th:fragment="content">
    <section class="panel" id="report-frame" th:fragment="frame">
      <p class="eyebrow" th:text="${report.title()}">Report</p>
      <p class="muted report__scope" th:text="${report.scopeLine()}">Scope</p>
      <p
        class="muted report__scope-mismatch"
        th:if="${report.scopeMismatch() != null}"
        th:text="${report.scopeMismatch()}"
      >
        Scope mismatch
      </p>
      <p class="muted">
        <span th:text="${#temporals.format(report.resolvedStart(), 'dd.MM.yyyy')}">start</span>
        &ndash;
        <span th:text="${#temporals.format(report.resolvedEnd(), 'dd.MM.yyyy')}">end</span>
      </p>
      <button
        type="button"
        class="btn btn--ghost"
        th:if="${hasChart}"
        hx-target="#report-frame"
        hx-swap="outerHTML"
        th:attr="hx-get=@{${viewBasePath}(view='chart')}"
      >
        Show chart
      </button>

      <table th:replace="~{fragments/report-table-body :: body}"></table>
    </section>

    <div th:replace="~{fragments/report-manage :: manage}"></div>

    <div th:if="${slug != null}" th:replace="~{fragments/report-copy :: copy}"></div>
  </main>
</html>
