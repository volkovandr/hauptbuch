<!DOCTYPE html>
<!--
  A Report's rendered table (plan stage b; the editor is stage d3; row-tree expand/collapse is
  plan stage e2, fragments/report-table-body.html). Every cell is already display-formatted text
  (ReportTableViewAssembler);
  blank means no postings, "—" means the aggregate is arithmetically meaningless (reporting.md §7).
  Shared by a Preset's own page (ReportController), a saved Report's own page
  (SavedReportController) and a not-yet-saved /reports/new draft (ReportEditorController) — all
  three populate `settings` (fragments/report-settings) and `editor` (fragments/report-actions)
  identically (PresetRendering). `page` is the whole settings-strip+frame+actions region every
  settings-strip control re-GETs and swaps via htmx (`#report-page`, outerHTML); the controllers
  return this fragment for an htmx request and the full document otherwise.
-->
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout :: page(~{:: content})}"
>
  <main class="content" th:fragment="content">
    <div id="report-page" th:fragment="page">
      <div th:replace="~{fragments/report-settings :: strip}"></div>

      <section class="panel" id="report-frame" th:fragment="frame">
        <p class="eyebrow" th:text="${report.title()}">Report</p>
        <p class="muted report__scope" th:text="${report.scopeLine()}">Scope</p>
        <p
          class="muted report__refusal"
          th:if="${report.refusalMessage() != null}"
          th:text="${report.refusalMessage()}"
        >
          Why the report is empty
        </p>
        <p class="muted">
          <span th:text="${#temporals.format(report.resolvedStart(), 'dd.MM.yyyy')}">start</span>
          &ndash;
          <span th:text="${#temporals.format(report.resolvedEnd(), 'dd.MM.yyyy')}">end</span>
        </p>

        <table th:replace="~{fragments/report-table-body :: table}"></table>
      </section>

      <div th:replace="~{fragments/report-actions :: actions}"></div>
    </div>
  </main>
</html>
